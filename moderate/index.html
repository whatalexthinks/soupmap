<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Soupmap · Field note review</title><link rel="stylesheet" href="/src/styles/site-shell.css"></head>
<body class="moderation-page"><!--soupmap:header:info--><main class="moderation-shell"><header><span class="eyebrow">EDITOR’S DESK</span><h1>Care for the guide.</h1><p>Review field notes before they reach the community. Approving a correction publishes the note; it does not replace the shop’s directory data.</p></header>
<form id="moderator-login" class="journey-form"><label>Moderator access token<input name="token" type="password" autocomplete="off" minlength="32" required></label><button class="btn btn--primary">Open review queue</button></form>
<p id="review-status" role="status"></p><section id="review-workspace" hidden><div class="review-toolbar"><label>Show <select id="review-filter"><option value="pending">Pending</option><option value="approved">Published</option><option value="rejected">Rejected</option><option value="all">All recent</option></select></label><button class="btn" id="review-refresh">Refresh</button><button class="text-btn" id="review-logout">Lock desk</button></div><div id="review-list"></div></section></main><script type="module" src="/src/moderate.ts"></script></body></html>
